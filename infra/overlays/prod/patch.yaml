apiVersion: v1
kind: ConfigMap
metadata: { name: backend-config }
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://api.prod.local
  CORS_ALLOWED_ORIGINS: https://app.prod.local
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: frontend }
spec: { replicas: 2 }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend }
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  template:
    spec:
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector: { matchLabels: { app.kubernetes.io/name: backend } }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: backend-worker }
spec: { replicas: 2 }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql }
spec:
  template:
    spec:
      # Los PVC hostPath de este laboratorio viven en el control plane.
      nodeSelector: { kubernetes.io/hostname: proyecto-prof }
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongodb }
spec:
  template:
    spec:
      # Los PVC hostPath de este laboratorio viven en el control plane.
      nodeSelector: { kubernetes.io/hostname: proyecto-prof }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata: { name: fitness }
spec:
  tls:
    - hosts: [app.prod.local, api.prod.local]
      secretName: fitness-prod-tls
  rules:
    - host: app.prod.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { name: http } } }
    - host: api.prod.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: backend, port: { name: http } } }
---
