apiVersion: v1
kind: LimitRange
metadata:
  name: workload-defaults
spec:
  limits:
    - type: Container
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      default:
        cpu: 500m
        memory: 512Mi
---
apiVersion: v1
kind: ResourceQuota
metadata:
  name: application-quota
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 8Gi
    # Supports the production HPA ceiling (6 backend replicas) and one
    # maxSurge replica during a zero-unavailable rolling update. CPU requests
    # remain capped at 4 so scheduling stays within the lab capacity budget.
    limits.cpu: "14"
    limits.memory: 16Gi
    persistentvolumeclaims: "8"
