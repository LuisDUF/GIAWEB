apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
data:
  APP_NAME: Fitness
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://api.replace.invalid
  CORS_ALLOWED_ORIGINS: https://app.replace.invalid
  LOG_CHANNEL: stderr
  DB_CONNECTION: mysql
  DB_HOST: mysql
  DB_PORT: "3306"
  CACHE_DRIVER: redis
  SESSION_DRIVER: redis
  QUEUE_CONNECTION: redis
  REDIS_CLIENT: phpredis
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  DB_MONGO_HOST: mongodb
  DB_MONGO_PORT: "27017"
  DB_MONGO_DATABASE: fitness_audit
  DB_MONGO_AUTHENTICATION_DATABASE: admin
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-nginx-config
data:
  default.conf: |
    server {
      listen 8080;
      server_name _;
      root /var/www/public;
      index index.php;
      location / { try_files $uri $uri/ /index.php?$query_string; }
      location ~ \.php$ {
        try_files $uri =404;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_pass 127.0.0.1:9000;
      }
    }
