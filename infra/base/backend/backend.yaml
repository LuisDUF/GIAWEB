apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  labels:
    app.kubernetes.io/name: backend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: backend
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 82
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: prepare-runtime-directories
          image: proyecto-kubernet/backend:local
          command: ["/bin/sh", "-c", "mkdir -p /runtime/framework/cache/data /runtime/framework/sessions /runtime/framework/views /runtime/logs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 82
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: laravel-storage
              mountPath: /runtime
        - name: publish-public-assets
          image: proyecto-kubernet/backend:local
          command: ["/bin/sh", "-c", "cp -r /var/www/. /shared/"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 82
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: public-code
              mountPath: /shared
      containers:
        - name: php-fpm
          image: proyecto-kubernet/backend:local
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 82
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 150m, memory: 256Mi }
            limits: { cpu: "1", memory: 512Mi }
          volumeMounts:
            - name: laravel-storage
              mountPath: /var/www/storage
            - name: laravel-cache
              mountPath: /var/www/bootstrap/cache
            - name: php-tmp
              mountPath: /tmp
        - name: nginx
          image: nginxinc/nginx-unprivileged:1.27-alpine
          ports:
            - name: http
              containerPort: 8080
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 101
            capabilities: { drop: ["ALL"] }
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 250m, memory: 128Mi }
          readinessProbe:
            httpGet: { path: /api/ready, port: http }
            initialDelaySeconds: 8
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /api/health, port: http }
            initialDelaySeconds: 20
            periodSeconds: 20
          volumeMounts:
            - name: public-code
              mountPath: /var/www
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d/default.conf
              subPath: default.conf
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
            - name: nginx-tmp
              mountPath: /tmp
      volumes:
        - name: public-code
          emptyDir: {}
        - name: laravel-storage
          emptyDir: {}
        - name: laravel-cache
          emptyDir: {}
        - name: php-tmp
          emptyDir: {}
        - name: nginx-config
          configMap: { name: backend-nginx-config }
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}
        - name: nginx-tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
spec:
  selector:
    app.kubernetes.io/name: backend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-worker
spec:
  replicas: 1
  selector:
    matchLabels: { app.kubernetes.io/name: backend-worker }
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend-worker }
    spec:
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 82
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: prepare-runtime-directories
          image: proyecto-kubernet/backend:local
          command: ["/bin/sh", "-c", "mkdir -p /runtime/framework/cache/data /runtime/framework/sessions /runtime/framework/views /runtime/logs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 82
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: storage
              mountPath: /runtime
      containers:
        - name: worker
          image: proyecto-kubernet/backend:local
          command: ["php", "artisan", "queue:work", "redis", "--sleep=3", "--tries=3", "--max-time=3600"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 82
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: app-secrets }
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { cpu: 500m, memory: 384Mi }
          volumeMounts:
            - name: storage
              mountPath: /var/www/storage
            - name: cache
              mountPath: /var/www/bootstrap/cache
            - name: php-tmp
              mountPath: /tmp
      volumes:
        - name: storage
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: php-tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-migrate
  annotations:
    app.kubernetes.io/purpose: "Run once for each approved release; delete/recreate before rerun."
spec:
  backoffLimit: 2
  template:
    metadata:
      labels: { app.kubernetes.io/name: backend-migrate }
    spec:
      restartPolicy: OnFailure
      serviceAccountName: backend
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 82
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: prepare-runtime-directories
          image: proyecto-kubernet/backend:local
          command: ["/bin/sh", "-c", "mkdir -p /runtime/framework/cache/data /runtime/framework/sessions /runtime/framework/views /runtime/logs"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 82
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            - name: storage
              mountPath: /runtime
      containers:
        - name: migrate
          image: proyecto-kubernet/backend:local
          command: ["/bin/sh", "-c", "php artisan migrate --force && php artisan db:seed --force && php artisan activity:mongo-indexes"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            runAsNonRoot: true
            runAsUser: 82
            capabilities: { drop: ["ALL"] }
          envFrom:
            - configMapRef: { name: backend-config }
            - secretRef: { name: app-secrets }
          volumeMounts:
            - name: storage
              mountPath: /var/www/storage
            - name: cache
              mountPath: /var/www/bootstrap/cache
            - name: php-tmp
              mountPath: /tmp
      volumes:
        - name: storage
          emptyDir: {}
        - name: cache
          emptyDir: {}
        - name: php-tmp
          emptyDir: {}
