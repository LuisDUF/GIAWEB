apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: fitness
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  tls:
    - hosts: [app.replace.invalid, api.replace.invalid]
      secretName: fitness-tls
  rules:
    - host: app.replace.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: frontend, port: { name: http } } }
    - host: api.replace.invalid
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: backend, port: { name: http } } }
