apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: database-backups }
spec:
  accessModes: ["ReadWriteOnce"]
  resources: { requests: { storage: 10Gi } }
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: mysql-backup }
spec:
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels: { app.kubernetes.io/name: backup }
        spec:
          restartPolicy: OnFailure
          securityContext: { seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: dump
              image: mysql:8.4.4
              command: ["/bin/sh", "-c", "mysqldump -h mysql -u$DB_USERNAME -p$DB_PASSWORD $DB_DATABASE | gzip > /backups/mysql-$(date +%F).sql.gz"]
              envFrom: [{ secretRef: { name: app-secrets } }]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 999
                capabilities: { drop: ["ALL"] }
              volumeMounts: [{ name: backups, mountPath: /backups }]
          volumes: [{ name: backups, persistentVolumeClaim: { claimName: database-backups } }]
---
apiVersion: batch/v1
kind: CronJob
metadata: { name: mongodb-backup }
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels: { app.kubernetes.io/name: backup }
        spec:
          restartPolicy: OnFailure
          securityContext: { seccompProfile: { type: RuntimeDefault } }
          containers:
            - name: dump
              image: mongo:8.0.4
              command: ["/bin/sh", "-c", "mongodump --host mongodb --username $DB_MONGO_USERNAME --password $DB_MONGO_PASSWORD --authenticationDatabase admin --db $DB_MONGO_DATABASE --archive=/backups/mongodb-$(date +%F).archive.gz --gzip"]
              envFrom: [{ secretRef: { name: app-secrets } }]
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: false
                runAsNonRoot: true
                runAsUser: 999
                capabilities: { drop: ["ALL"] }
              volumeMounts: [{ name: backups, mountPath: /backups }]
          volumes: [{ name: backups, persistentVolumeClaim: { claimName: database-backups } }]
