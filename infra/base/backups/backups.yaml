apiVersion: batch/v1
kind: CronJob
metadata:
  name: mysql-backup
spec:
  # Kubernetes interprets this schedule in the controller time zone (UTC in the
  # laboratory profile). MySQL runs before MongoDB to avoid both dumps competing.
  schedule: "15 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
            app.kubernetes.io/component: mysql-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: dump
              image: mysql:8.4.4
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  raw_dump="/work/mysql-${stamp}.sql"
                  # --no-tablespaces avoids requiring PROCESS from the application
                  # account; --single-transaction keeps an InnoDB-consistent dump.
                  mysqldump --single-transaction --set-gtid-purged=OFF --no-tablespaces \
                    --host=mysql --user="$DB_USERNAME" --password="$DB_PASSWORD" "$DB_DATABASE" > "$raw_dump"
                  gzip -9 "$raw_dump"
                  sha256sum "${raw_dump}.gz" > "${raw_dump}.gz.sha256"
              envFrom:
                - secretRef: { name: app-secrets }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 999
                capabilities: { drop: ["ALL"] }
              volumeMounts: [{ name: work, mountPath: /work }]
          containers:
            - name: encrypt-upload-prune
              image: rclone/rclone:1.69.1
              command: ["/bin/sh", "/scripts/upload-and-prune.sh"]
              env:
                - name: BACKUP_KIND
                  value: mysql
                - name: BACKUP_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: BACKUP_RETENTION_DAYS
                  valueFrom: { configMapKeyRef: { name: backup-policy, key: BACKUP_RETENTION_DAYS } }
                - name: BACKUP_REMOTE
                  valueFrom: { configMapKeyRef: { name: backup-policy, key: BACKUP_REMOTE } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: work, mountPath: /work, readOnly: true }
                - { name: rclone-config, mountPath: /config, readOnly: true }
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - name: work
              emptyDir: {}
            - name: rclone-config
              secret: { secretName: backup-object-storage }
            - name: scripts
              configMap: { name: backup-scripts, defaultMode: 0444 }
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: mongodb-backup
spec:
  schedule: "30 2 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 5
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            app.kubernetes.io/name: backup
            app.kubernetes.io/component: mongodb-backup
        spec:
          restartPolicy: OnFailure
          automountServiceAccountToken: false
          securityContext:
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile: { type: RuntimeDefault }
          initContainers:
            - name: dump
              image: mongo:8.0.4
              command: ["/bin/sh", "-ec"]
              args:
                - |
                  stamp="$(date -u +%Y%m%dT%H%M%SZ)"
                  archive="/work/mongodb-${stamp}.archive.gz"
                  mongodump --host=mongodb --username="$DB_MONGO_USERNAME" \
                    --password="$DB_MONGO_PASSWORD" --authenticationDatabase=admin \
                    --db="$DB_MONGO_DATABASE" --archive="$archive" --gzip
                  sha256sum "$archive" > "${archive}.sha256"
              envFrom:
                - configMapRef: { name: backend-config }
                - secretRef: { name: app-secrets }
              resources:
                requests: { cpu: 100m, memory: 128Mi }
                limits: { cpu: 500m, memory: 512Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 999
                capabilities: { drop: ["ALL"] }
              volumeMounts: [{ name: work, mountPath: /work }]
          containers:
            - name: encrypt-upload-prune
              image: rclone/rclone:1.69.1
              command: ["/bin/sh", "/scripts/upload-and-prune.sh"]
              env:
                - name: BACKUP_KIND
                  value: mongodb
                - name: BACKUP_NAMESPACE
                  valueFrom: { fieldRef: { fieldPath: metadata.namespace } }
                - name: BACKUP_RETENTION_DAYS
                  valueFrom: { configMapKeyRef: { name: backup-policy, key: BACKUP_RETENTION_DAYS } }
                - name: BACKUP_REMOTE
                  valueFrom: { configMapKeyRef: { name: backup-policy, key: BACKUP_REMOTE } }
              resources:
                requests: { cpu: 50m, memory: 64Mi }
                limits: { cpu: 250m, memory: 256Mi }
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                runAsNonRoot: true
                runAsUser: 65532
                capabilities: { drop: ["ALL"] }
              volumeMounts:
                - { name: work, mountPath: /work, readOnly: true }
                - { name: rclone-config, mountPath: /config, readOnly: true }
                - { name: scripts, mountPath: /scripts, readOnly: true }
          volumes:
            - name: work
              emptyDir: {}
            - name: rclone-config
              secret: { secretName: backup-object-storage }
            - name: scripts
              configMap: { name: backup-scripts, defaultMode: 0444 }
