apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - backups.yaml

# This only identifies the encrypted rclone remote and retention. Credentials
# remain in the backup-object-storage Secret outside Git.
configMapGenerator:
  - name: backup-policy
    literals:
      - BACKUP_REMOTE=backup-crypt:fitness
      - BACKUP_RETENTION_DAYS=14
  - name: backup-scripts
    files:
      - upload-and-prune.sh

# Stable names keep rendered Secret/ConfigMap references readable and explicit.
generatorOptions:
  disableNameSuffixHash: true
