# Valores de laboratorio para kube-prometheus-stack 92.14.1.
# La contraseña de Grafana se crea como Secret `grafana-admin` fuera de Git.
grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  persistence:
    enabled: true
    storageClassName: standard
    size: 2Gi
  # hostpath de Minikube es local al nodo que aprovisiona el volumen.
  nodeSelector:
    kubernetes.io/hostname: proyecto-prof
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 500m, memory: 512Mi }
  livenessProbe:
    initialDelaySeconds: 180
  readinessProbe:
    initialDelaySeconds: 30
  sidecar:
    datasources:
      enabled: true
      label: grafana_datasource
      searchNamespace: ALL

prometheus:
  prometheusSpec:
    retention: 7d
    serviceMonitorSelectorNilUsesHelmValues: false
    serviceMonitorSelector: {}
    serviceMonitorNamespaceSelector: {}
    podMonitorSelectorNilUsesHelmValues: false
    podMonitorSelector: {}
    ruleSelectorNilUsesHelmValues: false
    ruleSelector: {}
    ruleNamespaceSelector: {}
    # Mantener el PVC hostpath en el nodo que lo aprovisiona.
    nodeSelector:
      kubernetes.io/hostname: proyecto-prof
    resources:
      requests: { cpu: 150m, memory: 512Mi }
      limits: { cpu: 500m, memory: 1Gi }
    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: standard
          accessModes: ["ReadWriteOnce"]
          resources:
            requests:
              storage: 4Gi

alertmanager:
  enabled: true
  alertmanagerSpec:
    nodeSelector:
      kubernetes.io/hostname: proyecto-prof
    resources:
      requests: { cpu: 25m, memory: 64Mi }
      limits: { cpu: 150m, memory: 192Mi }

prometheusOperator:
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits: { cpu: 250m, memory: 256Mi }

kube-state-metrics:
  resources:
    requests: { cpu: 25m, memory: 64Mi }
    limits: { cpu: 100m, memory: 128Mi }

prometheus-node-exporter:
  resources:
    requests: { cpu: 25m, memory: 32Mi }
    limits: { cpu: 100m, memory: 64Mi }

defaultRules:
  create: true
