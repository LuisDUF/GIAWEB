server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    # El pod escucha HTTP:8080, pero el acceso público de dev termina TLS en el
    # Ingress (https://app.dev.local:8443). Sin esta regla, Nginx convierte
    # /dashboard en una redirección absoluta a su puerto interno :8080.
    # Las redirecciones relativas preservan el esquema y puerto del navegador.
    absolute_redirect off;
    location = /dashboard { return 308 /dashboard/; }
    location / { try_files $uri $uri/ /index.html; }
    location = /health { access_log off; return 200 'ok\n'; add_header Content-Type text/plain; }
}
